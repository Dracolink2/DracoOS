<div id="tl"><button id="op">📂</button><button id="sv">💾 CSV</button><span id="m" style="opacity:.6">Formules : =A1+B2*3, =SUM(A1:A5), =AVG(B1:B4)</span></div><div id="wr"><table id="tb"></table></div>
<script>
const R=30,C=12,col=i=>String.fromCharCode(65+i);let D={},f=DRACO_ARGS.path;
function val(k,d){d=d||0;if(d>20)return '#ERR';let v=D[k];if(v==null||v==='')return 0;if(v[0]!='=')return isNaN(+v)?v:+v;
let e=v.slice(1).toUpperCase().replace(/(SUM|AVG)\(([A-L])(\d+):([A-L])(\d+)\)/g,(_,fn,a,r1,b,r2)=>{const xs=[];for(let c=a.charCodeAt(0);c<=b.charCodeAt(0);c++)for(let r=+r1;r<=+r2;r++){const n=val(String.fromCharCode(c)+r,d+1);if(typeof n=='number')xs.push(n)}const s=xs.reduce((p,q)=>p+q,0);return fn=='SUM'?s:s/(xs.length||1)});
e=e.replace(/([A-L])(\d+)/g,(_,c,r)=>{const n=val(c+r,d+1);return typeof n=='number'?n:0});
if(!/^[0-9+\-*\/(). e]+$/.test(e))return '#ERR';try{return Function('return '+e)()}catch(x){return '#ERR'}}
const fmt=k=>{const v=D[k];if(v==null||v==='')return '';if(v[0]!='=')return v;const n=val(k);return typeof n=='number'?String(Math.round(n*1e6)/1e6):n};
function build(){tb.innerHTML='<tr><th></th>'+[...Array(C)].map((_,i)=>'<th>'+col(i)+'</th>').join('')+'</tr>';
for(let r=1;r<=R;r++){const tr=document.createElement('tr');tr.innerHTML='<th>'+r+'</th>';for(let c=0;c<C;c++){const k=col(c)+r,td=document.createElement('td'),i=document.createElement('input');
i.value=fmt(k);i.dataset.k=k;i.onfocus=()=>i.value=D[k]||'';i.onblur=()=>{D[k]=i.value;refresh()};i.onkeydown=e=>{if(e.key=='Enter')i.blur()};td.appendChild(i);tr.appendChild(td)}tb.appendChild(tr)}}
function refresh(){document.querySelectorAll('td input').forEach(i=>{if(document.activeElement!==i)i.value=fmt(i.dataset.k)})}
const toCSV=()=>{const o=[];for(let r=1;r<=R;r++){const row=[];for(let c=0;c<C;c++)row.push((D[col(c)+r]||'').replace(/[,\n]/g,';'));o.push(row.join(','))}return o.join('\n')};
function fromCSV(t){D={};t.split('\n').forEach((l,r)=>l.split(',').forEach((x,c)=>{if(x&&c<C&&r<R)D[col(c)+(r+1)]=x}))}
document.getElementById('sv').onclick=async()=>{if(!f){const n=prompt('Enregistrer sous :','/Documents/tableur.csv');if(!n)return;f=n}const r=await Draco.fs_write(f,toCSV());m.textContent=r&&r.error?r.error:'Enregistré : '+f};
op.onclick=async()=>{const n=await Draco.pick({start:'/Documents',ext:['csv','txt']});if(!n)return;const t=await Draco.fs_read(n);if(t==null)return m.textContent='Introuvable';f=n;fromCSV(t);build();m.textContent=n};
if(f)Draco.fs_read(f).then(t=>{if(t!=null)fromCSV(t);build()});else build();
</script></template>

 const tag=e.target&&e.target.tagName,typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable;
 if(e.key==='F1'){e.preventDefault();shortcutHelp();return}
 if(e.key==='Escape'&&$('#shortcut-help')){$('#shortcut-help').remove();return}
 if(typing)return;
 const k=e.key.toLowerCase(),meta=e.metaKey||e.key==='Meta';
 if(e.ctrlKey&&e.shiftKey&&k==='escape'){e.preventDefault();open('taskmgr');return}
 if(e.ctrlKey&&e.altKey&&k==='t'){e.preventDefault();open('terminal');return}
 if(meta&&k==='e'){e.preventDefault();open('explorer');return}
 if(meta&&k==='i'){e.preventDefault();open('settings');return}
 if(meta&&k==='l'){e.preventDefault();$('#lo').click();return}
 if(meta&&k==='r'){e.preventDefault();open('terminal');return}
 if(e.key==='Meta'){e.preventDefault();$('#sm').classList.toggle('o');$('#sq').value='';renderMenu();if($('#sm').classList.contains('o'))$('#sq').focus();renderTb();return}
 if(e.altKey&&e.key==='Tab'){
   e.preventDefault();const a=Object.entries(wins).filter(([id,w])=>!w.el.classList.contains('hid'));
   if(a.length){a.sort((x,y)=>Number(y[1].el.style.zIndex||0)-Number(x[1].el.style.zIndex||0));const active=a.findIndex(([id,w])=>Number(w.el.style.zIndex||0)===zi);const next=a[(active<0?0:active+1)%a.length];if(next){next[1].el.classList.remove('hid');foc(next[0])}}
 }
});
